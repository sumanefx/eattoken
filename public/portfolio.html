<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | NovaPortfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope', 'sans-serif'] }, colors: { bg: '#0B0B0F', card: '#111117', border: '#1E1E26', accent: '#6B8CFF', textSub: '#A0A0B0' } } } };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-bg text-white font-sans min-h-screen p-4 md:p-8">
    <main class="max-w-6xl mx-auto space-y-6">
      <a href="/" class="text-accent">← Explore portfolios</a>
      <section id="profileHeader" class="rounded-2xl border border-border bg-card/80 backdrop-blur-xl p-6"></section>
      <section>
        <h2 class="text-xl font-bold mb-3">Projects</h2>
        <div id="projectGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
