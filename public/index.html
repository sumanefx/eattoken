<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaPortfolio | Showcase Your Work</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif']
            },
            colors: {
              bg: '#0B0B0F',
              card: '#111117',
              border: '#1E1E26',
              accent: '#6B8CFF',
              textMain: '#FFFFFF',
              textSub: '#A0A0B0'
            },
            boxShadow: {
              glow: '0 0 0 1px rgba(107,140,255,.25), 0 15px 35px rgba(0,0,0,.35)'
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-bg text-textMain font-sans min-h-screen">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(107,140,255,.2),transparent_45%)] pointer-events-none"></div>
    <main class="relative max-w-6xl mx-auto px-4 py-10 space-y-10">
      <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 rounded-2xl border border-border bg-card/70 backdrop-blur-xl p-6 shadow-glow animate-pulse">
        <div>
          <p class="text-textSub text-sm uppercase tracking-[0.2em]">Modern Portfolio Platform</p>
          <h1 class="text-3xl font-extrabold">Build. Share. Get Discovered.</h1>
        </div>
        <div class="flex gap-3">
          <a href="/auth" class="px-4 py-2 rounded-lg border border-border hover:border-accent transition">Signup / Login</a>
          <a href="/dashboard" class="px-4 py-2 rounded-lg bg-accent text-white hover:opacity-90 transition">Dashboard</a>
        </div>
      </header>

      <section class="rounded-2xl border border-border bg-card/60 backdrop-blur-xl p-6">
        <div class="flex flex-col md:flex-row gap-4">
          <input id="searchInput" type="text" placeholder="Search by username, skills, or tags..." class="flex-1 bg-bg border border-border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-accent" />
          <button id="searchBtn" class="px-6 py-3 rounded-lg bg-accent hover:opacity-90 transition">Search</button>
        </div>
        <div id="searchResults" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-6"></div>
      </section>

      <section>
        <div class="flex items-center justify-between">
          <h2 class="text-2xl font-bold">Featured Portfolios</h2>
          <p class="text-textSub text-sm">Curated by admins</p>
        </div>
        <div id="featuredGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4"></div>
      </section>
    </main>

    <script src="/js/main.js"></script>
  </body>
</html>
