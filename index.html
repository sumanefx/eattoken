
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Token Generator</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #2a2a2a; color: white; }
        .btn-main { background: linear-gradient(90deg, #ff00ff, #8000ff); color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        #resSection { display: none; margin-top: 20px; padding: 15px; background: #222; border-radius: 10px; border: 1px dashed #555; word-break: break-all; }
        .token-box { color: #00ff00; font-family: monospace; font-size: 14px; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ACCESS GENERATOR</h2>
        <input type="text" id="urlInput" placeholder="Paste Full URL or EAT Token here...">
        <button class="btn-main" onclick="process()">GENERATE ACCESS →</button>

        <div id="resSection">
            <span style="color: #aaa;">GENERATED ACCESS TOKEN:</span>
            <span id="tokenTxt" class="token-box"></span>
        </div>
    </div>

    <script>
    async function process() {
        const input = document.getElementById('urlInput').value;
        let eatToken = input.includes("?eat=") ? new URLSearchParams(new URL(input).search).get('eat') : input;
        
        if(!eatToken) return alert("Sahi URL dalo bhai!");

        document.querySelector('.btn-main').innerText = "Processing...";

        try {
            // Calling your Vercel Backend
            const res = await fetch(`/api/get-token?eat=${eatToken}`);
            const data = await res.json();

            if(data.access_token) {
                document.getElementById('tokenTxt').innerText = data.access_token;
                document.getElementById('resSection').style.display = 'block';
            } else {
                alert("Token generate nahi hua! EAT check karein.");
            }
        } catch (e) {
            alert("API Error! Server check karein.");
        } finally {
            document.querySelector('.btn-main').innerText = "GENERATE ACCESS →";
        }
    }
    </script>
</body>
</html>
